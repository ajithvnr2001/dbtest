[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamil-movie-music"
version = "0.1.0"
description = "Build a verified Apple Music soundtrack index from IMDb's Tamil movie titles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scrapling[fetchers]>=0.2.99",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tamil-music = "tamil_music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
